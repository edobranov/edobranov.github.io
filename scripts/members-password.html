<!doctype html>
<!--
  Password screen for /members, used by scripts/encrypt-members.mjs. Based on StatiCrypt's default
  template (node_modules/staticrypt/lib/password_template.html); keep the element ids and the
  /*[|...|]*/0 placeholders, which StatiCrypt fills in when it encrypts the page.
-->
<html class="staticrypt-html" lang="en">
  <head>
    <meta charset="utf-8" />
    <title>/*[|template_title|]*/0 · GORANA DANCE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.png" />
    <!-- do not cache this page -->
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="pragma" content="no-cache" />
    <script>
      // Same saved light/dark choice as the rest of the site.
      try {
        var t = localStorage.getItem("gd-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f4f2;
        --card: #ffffff;
        --text: #1a1b1e;
        --muted: #6b7078;
        --border: #d7d0cb;
        --accent: #c8282e;
        --accent-strong: #c8282e;
        --mark: #f56a6a;
        --shadow: 0 1px 2px rgb(30 10 10 / 0.05), 0 18px 40px -14px rgb(30 10 10 / 0.22);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: #0d0d0f;
          --card: #18181c;
          --text: #eeeef0;
          --muted: #9b9da5;
          --border: #36363e;
          --accent: #ff6b6b;
          --accent-strong: #d2363c;
          --shadow: 0 1px 2px rgb(0 0 0 / 0.5), 0 18px 40px -14px rgb(0 0 0 / 0.8);
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0d0d0f;
        --card: #18181c;
        --text: #eeeef0;
        --muted: #9b9da5;
        --border: #36363e;
        --accent: #ff6b6b;
        --accent-strong: #d2363c;
        --shadow: 0 1px 2px rgb(0 0 0 / 0.5), 0 18px 40px -14px rgb(0 0 0 / 0.8);
      }
      *, *::before, *::after { box-sizing: border-box; }
      .staticrypt-html, .staticrypt-body { height: 100%; }
      .staticrypt-body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 400 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .hidden { display: none !important; }

      .staticrypt-content { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
      .card {
        width: min(100%, 380px);
        padding: 36px 28px 28px;
        background: var(--card);
        border-radius: 20px;
        box-shadow: var(--shadow);
        text-align: center;
      }
      .mark { display: block; width: 56px; height: 4px; margin: 0 auto 20px; border-radius: 4px; background: var(--mark); }
      h1 { margin: 0 0 8px; font-size: 26px; font-weight: 800; letter-spacing: -0.01em; text-transform: uppercase; }
      .instructions { margin: 0 0 24px; color: var(--muted); font-size: 15px; }

      .field { position: relative; margin-bottom: 14px; }
      .field input {
        width: 100%;
        padding: 14px 48px 14px 16px;
        border: 1.5px solid var(--border);
        border-radius: 12px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 16px; /* 16px stops iPhones from zooming in on focus */
      }
      .field input:focus { outline: none; border-color: var(--accent); }
      .toggle {
        position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
        width: 40px; height: 40px; display: grid; place-items: center;
        border: 0; border-radius: 10px; background: none; color: var(--muted); cursor: pointer;
      }
      .toggle:hover { color: var(--text); }
      .toggle svg { width: 20px; height: 20px; }
      .toggle .eye-off, .toggle.showing .eye { display: none; }
      .toggle.showing .eye-off { display: block; }

      .staticrypt-remember { display: flex; align-items: center; gap: 10px; margin: 4px 0 18px; font-size: 15px; text-align: left; cursor: pointer; }
      .staticrypt-remember input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent-strong); }

      .error { margin: -6px 0 14px; color: var(--accent); font-size: 14.5px; font-weight: 500; }

      .staticrypt-decrypt-button {
        width: 100%;
        padding: 14px;
        border: 0;
        border-radius: 999px;
        background: var(--accent-strong);
        color: #fff;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      .staticrypt-decrypt-button:hover { filter: brightness(1.08); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

      .back { display: inline-block; margin-top: 20px; color: var(--muted); font-size: 14px; text-decoration: none; }
      .back:hover { color: var(--accent); }

      .staticrypt-spinner-container { height: 100%; display: flex; align-items: center; justify-content: center; }
      .staticrypt-spinner {
        width: 2rem; height: 2rem; border-radius: 50%;
        border: 0.25em solid var(--muted); border-right-color: transparent;
        animation: spin 0.75s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body class="staticrypt-body">
    <div id="staticrypt_loading" class="staticrypt-spinner-container">
      <div class="staticrypt-spinner"></div>
    </div>

    <main id="staticrypt_content" class="staticrypt-content hidden">
      <div class="card">
        <span class="mark" aria-hidden="true"></span>
        <h1>/*[|template_title|]*/0</h1>
        <p class="instructions">/*[|template_instructions|]*/0</p>

        <form id="staticrypt-form" action="#" method="post">
          <div class="field">
            <input
              id="staticrypt-password"
              type="password"
              name="password"
              placeholder="/*[|template_placeholder|]*/0"
              aria-label="/*[|template_placeholder|]*/0"
              autocomplete="current-password"
              autofocus
            />
            <button class="toggle" type="button" aria-label="/*[|template_toggle_show|]*/0" title="/*[|template_toggle_show|]*/0">
              <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" />
              </svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10.7 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.2 3.2M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.8-1.3M9.9 9.9a3 3 0 0 0 4.2 4.2M2 2l20 20" />
              </svg>
            </button>
          </div>

          <label id="staticrypt-remember-label" class="staticrypt-remember hidden">
            <input id="staticrypt-remember" type="checkbox" name="remember" checked />
            /*[|template_remember|]*/0
          </label>

          <p id="staticrypt-error" class="error hidden" role="alert">/*[|template_error|]*/0</p>

          <input type="submit" class="staticrypt-decrypt-button" value="/*[|template_button|]*/0" />
        </form>

        <a class="back" href="/">← goranadance.com</a>
      </div>
    </main>

    <script>
      // these variables will be filled when generating the file - the template format is '/*[|variable_name|]*/0'
      const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
      const templateToggleAltShow = "/*[|template_toggle_show|]*/0",
        templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
        isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
        staticryptConfig = /*[|staticrypt_config|]*/ 0;

      const templateConfig = {
        rememberExpirationKey: "staticrypt_expiration",
        rememberPassphraseKey: "staticrypt_passphrase",
        replaceHtmlCallback: null,
        clearLocalStorageCallback: null,
      };

      const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

      // Decrypt straight away if this device remembered the password; otherwise show the form.
      window.onload = async function () {
        const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
        if (!isSuccessful) {
          document.getElementById("staticrypt_loading").classList.add("hidden");
          document.getElementById("staticrypt_content").classList.remove("hidden");
          document.getElementById("staticrypt-password").focus();
          if (isRememberEnabled) document.getElementById("staticrypt-remember-label").classList.remove("hidden");
        }
      };

      const toggle = document.querySelector(".toggle");
      toggle.addEventListener("click", function () {
        const input = document.getElementById("staticrypt-password");
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        toggle.classList.toggle("showing", show);
        const label = show ? templateToggleAltHide : templateToggleAltShow;
        toggle.setAttribute("aria-label", label);
        toggle.title = label;
      });

      const error = document.getElementById("staticrypt-error");
      document.getElementById("staticrypt-password").addEventListener("input", function () {
        error.classList.add("hidden");
      });

      document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        const password = document.getElementById("staticrypt-password").value,
          isRememberChecked = document.getElementById("staticrypt-remember").checked;
        const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);
        if (!isSuccessful) error.classList.remove("hidden");
      });
    </script>
  </body>
</html>
