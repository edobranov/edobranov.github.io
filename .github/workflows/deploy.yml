name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish instead of cancelling it when a newer push arrives.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Repository secrets for the password-protected /members page (see README).
    env:
      MEMBERS_PASSWORD: ${{ secrets.MEMBERS_PASSWORD }}
      MEMBERS_CALENDAR: ${{ secrets.MEMBERS_CALENDAR }}
      MEMBERS_LINKS: ${{ secrets.MEMBERS_LINKS }}
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
